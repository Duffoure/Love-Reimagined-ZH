l_simp_chinese:
 game_rule_category_carnx_carnalitas_sex: "卡纳利塔斯爱情重塑"

 rule_carnx_sex_requires_same_location: "#X CLR:#! 性互动要求位于同一地点"
 setting_carnx_sex_requires_same_location_disabled: "#high 禁用#!"
 setting_carnx_sex_requires_same_location_disabled_desc: "性互动不需要两个角色都在同一地点。"
 setting_carnx_sex_requires_same_location_enabled: "启用"
 setting_carnx_sex_requires_same_location_enabled_desc: "性互动要求两个角色都在同一地点。"

 rule_carnx_sex_interaction_effect_cd: "#X CLR:#! $carn_sex_interaction$冷却期间效果"
 setting_carnx_sex_interaction_effect_cd_disabled: "#high 解除封锁#!"
 setting_carnx_sex_interaction_effect_cd_disabled_desc: "如果你在过去 [EmptyScope.ScriptValue('carn_sex_interaction_cooldown_base')|0] 个月内使用过类似的互动，则只有压力效果会降低。"
 setting_carnx_sex_interaction_effect_cd_enabled: "封锁"
 setting_carnx_sex_interaction_effect_cd_enabled_desc: "如果你在过去 [EmptyScope.ScriptValue('carn_sex_interaction_cooldown_base')|0] 个月内使用过类似的互动，则不会产生任何游戏效果。"

 rule_carnx_sex_interaction_cd_recipient: "#X CLR:#! $carn_sex_interaction$针对伴侣的冷却"
 setting_carnx_sex_interaction_cd_recipient_disabled: "禁用"
 setting_carnx_sex_interaction_cd_recipient_disabled_desc: "你可以随心所欲地与同一个伴侣做爱。"
 setting_carnx_sex_interaction_cd_recipient_enabled: "#high 启用#!"
 setting_carnx_sex_interaction_cd_recipient_enabled_desc: "你每 [EmptyScope.ScriptValue('carn_sex_interaction_cooldown_base')|0] 个月只能与同一个伴侣做爱一次。"

 rule_carnx_sex_demand_sex_from_hooked_characters: "#X CLR:#! 向有牵制的角色强迫性行为"
 setting_carnx_sex_demand_sex_from_hooked_characters_disabled: "禁用"
 setting_carnx_sex_demand_sex_from_hooked_characters_disabled_desc: "你不能向有牵制的角色强迫性行为（除非你是勾引者并且对他们拥有强牵制）。"
 setting_carnx_sex_demand_sex_from_hooked_characters_strong_hooks: "#high 仅限强牵制#!"
 setting_carnx_sex_demand_sex_from_hooked_characters_strong_hooks_desc: "只有在你对有牵制的角色拥有强牵制时，你才能向其强迫性行为。"
 setting_carnx_sex_demand_sex_from_hooked_characters_all_hooks: "#high 所有牵制#!"
 setting_carnx_sex_demand_sex_from_hooked_characters_all_hooks_desc: "你总可以向有牵制的角色强迫性行为。"

 rule_carnx_sex_demand_sex_consumes_slave_hooks: "#X CLR:#! 强迫性行为消耗奴隶牵制"
 setting_carnx_sex_demand_sex_consumes_slave_hooks_disabled: "#high 禁用#!"
 setting_carnx_sex_demand_sex_consumes_slave_hooks_disabled_desc: "向奴隶强迫性行为不会消耗其奴隶牵制。"
 setting_carnx_sex_demand_sex_consumes_slave_hooks_enabled: "启用"
 setting_carnx_sex_demand_sex_consumes_slave_hooks_enabled_desc: "向奴隶强迫性行为会消耗其奴隶牵制。"

 rule_carnx_sex_memories: "#X CLR:#! 卡纳利塔斯性记忆"
 setting_carnx_sex_memories_disabled: "禁用"
 setting_carnx_sex_memories_disabled_desc: "禁用卡纳利塔斯性记忆。"
 setting_carnx_sex_memories_enabled: "#high 启用#!"
 setting_carnx_sex_memories_enabled_desc: "启用卡纳利塔斯性记忆。"
